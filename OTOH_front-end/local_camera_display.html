<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>On The Other Hand</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

</head>
<body>

    <div id="camera_interface_container">
        <div id="video_container">
            <video id="local_cam" autoplay playsinline></video>
            <canvas id="cam_overlay"></canvas>
        </div>

        <div id="camera_controls">
            <button class="cam_btn toggle_fingertracking"></button>
            <button class="cam_btn toggle_camera_on"></button>
            <button class="cam_btn toggle_idk"></button>
        </div>
    </div>
    
    <script src="local_camera_handling.js"></script>
</body>
</html>
